name: Generate Activity Graph

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12 hours
  workflow_dispatch:          # lets you trigger it manually too

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Generate activity graph
        uses: Ashutosh00710/github-readme-activity-graph@v2.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: agniveshtm
          theme: react-dark
          hide_border: true
          area: true
          output: activity-graph.svg

      - name: Push activity-graph.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: .
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
